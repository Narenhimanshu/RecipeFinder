<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Recipe Finder</h1>
        <h3>Search mouth watering recipe to satisfy your craving</h3>
        <div class="searchBox">
            <input type="text" placeholder="Search for recipe" id="searchInput">
            <button id="searchBtn">Search</button>
        </div>
    </div>
    <div id="recipes" class="recipes"></div>
    <div id="notFound" class="notFound">Please enter the Recipe name to search!</div>

</html>
